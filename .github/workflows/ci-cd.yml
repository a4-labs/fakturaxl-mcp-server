name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN wystarcza do publikacji w GHCR - bez wlasnych PAT-ow.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/socialbuzzstudio/fakturaxl-mcp-server
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v5

      - name: Odczyt wersji z package.json
        id: version
        run: echo "VERSION=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Testy i kontrola typów
        run: |
          npm ci
          npm test
          npm run typecheck

      # Domyslny sterownik `docker` nie umie eksportowac cache - potrzebny docker-container.
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logowanie do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # target: runtime jest OBOWIAZKOWY - ostatni etap w Dockerfile to `dev`
      # (hot-reload), wiec build bez targetu wypchnalby obraz deweloperski.
      # Kompilacja TypeScript dzieje sie w etapie build, wiec blad typow zatrzyma CI.
      - name: Budowanie i push obrazu Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Serwer nie trzyma zadnych poswiadczen do GHCR - loguje sie tokenem waznym
      # tylko na czas tego przebiegu i wylogowuje po pobraniu obrazu.
      - name: Deploy na serwer przez SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /home/user/myapps/fakturaxl-mcp-server
            docker compose pull
            docker compose up -d
            docker logout ghcr.io
            docker image prune -f
