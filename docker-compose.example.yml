# SZABLON (przyklad) docker-compose dla wdrozenia za Traefikiem.
# Skopiuj do docker-compose.yml i dostosuj domene / certresolver / zmienne.
# Wzorowane na wewnetrznym standardzie (Traefik + zewnetrzna siec traefik-net).
#
# Przydatne zmienne (mozna trzymac w pliku .env obok):
#   MCP_DOMAIN=fakturaxl-mcp.twoja-domena.pl
#   TRAEFIK_CERTRESOLVER=myresolver

services:
  fakturaxl-mcp:
    # Obraz z GHCR, budowany i wypychany przez GitHub Actions.
    # Nazwa organizacji i repo MALYMI literami. Paczka jest prywatna, wiec reczny
    # pull wymaga `docker login ghcr.io` (CI loguje sie tokenem na czas przebiegu).
    image: ghcr.io/<organizacja-github>/fakturaxl-mcp-server:latest
    # Alternatywnie budowanie lokalnie zamiast pobierania obrazu:
    # build:
    #   context: .
    #   target: runtime
    container_name: fakturaxl-mcp
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
      - LOG_LEVEL=info
      - LOG_TO_FILE=false
      - FAKTURAXL_BASE_URL=https://program.fakturaxl.pl/api
      # Parametry warstwy praktycznej (opcjonalne):
      - DEFAULT_LIST_LIMIT=50
      - MAX_LIST_LIMIT=500
      - MAX_RANGE_MONTHS=24
      - CACHE_TTL_MS=300000
      - PAGE_SIZE=500
      - RATE_LIMIT_RETRIES=5
      - TOOL_BUDGET_MS=40000
      - LOG_BODY_MAX_CHARS=2000
    # Rotacja logow: bez tego json-file rosnie bez limitu (surowe body XML sa duze).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fakturaxl-mcp.rule=Host(`${MCP_DOMAIN}`)"
      - "traefik.http.routers.fakturaxl-mcp.entrypoints=websecure"
      - "traefik.http.routers.fakturaxl-mcp.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.routers.fakturaxl-mcp.service=fakturaxl-mcp"
      - "traefik.http.services.fakturaxl-mcp.loadbalancer.server.port=3000"
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
